name: Build and Deploy Quarto to Netlify

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Setup R ----
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # ---- Install system deps (important for many R packages) ----
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev

      # ---- Install R packages ----
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown","knitr"), repos="https://cloud.r-project.org")'

      # ---- Setup Quarto ----
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # ---- Render site ----
      - name: Render Quarto
        run: quarto render

      # ---- Deploy to Netlify ----
      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=_site \
            --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --site=${{ secrets.NETLIFY_SITE_ID }}